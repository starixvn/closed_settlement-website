<tr class="fs10 c {bgClass} match_row_{matchid}">
    <td>
        <div class="c"style="width: 120px;">{code}</div>
    </td>
    <td rowspan="2">
        <div class="c"style="width: 120px;">{date}</div>
    </td>
    <td class="colEvent_Badminton">
        <div class="b teamname ht">{homeTeam}</div>
    </td>    
    <td>
        <div style="width: 22px;">{home1Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{home2Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{home3Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{home4Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{home5Q}</div>
    </td>
    <td>
        <div class="htsc"style="width: 40px;">{homeTG}</div>
    </td>
    <td>
        <div class="ftsc"style="width: 40px;">{homeTS}</div>
    </td>
    <td rowspan="2">
        <div class="htsc"style="width: 60px;">{eventstatus}</div>
    </td>
  {calLink}   
    <td rowspan="2">
        <div style="width: 60px;">
            <!--confirmpendingread-->
            <input type="checkbox" {ispending} disabled="disabled" />
            <!--/confirmpendingread-->
            <!--confirmpendinghost-->
            <input type="checkbox" {ispending} {displaypending} onclick="updateIsPending(this,'{matchid}');" />
            <!--/confirmpendinghost-->
        </div>
    </td>
    <!--confirmht-->
    <td rowspan="2">
        <div style="width: 60px;">{confirmht}</div>
    </td>
    <!--/confirmht-->
    <!--confirmft-->
    <td rowspan="2">
        <div style="width: 60px;">{confirmft}</div>
    </td>
    <!--/confirmft-->
</tr>
<tr class="fs10 c {bgClass}">
    <td>
        <div style="width: 120px;">
            <div onclick="ShowSettlementLog('{code}', '{fdate}', '{tdate}');" class="viewhis"></div>
            <div class="undecided_{isdecided} {hand}" {event} title="{ContentOfTooltip}"></div>
        </div>
    </td>
    <td class="colEvent_Badminton">
        <div class="b teamname at">{awayTeam}</div>
    </td>
    <td>
        <div style="width: 22px;">{away1Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{away2Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{away3Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{away4Q}</div>
    </td>
    <td>
        <div style="width: 22px;">{away5Q}</div>
    </td>
    <td>
        <div class="htsc" style="width: 40px;">{awayTG}</div>
    </td>
    <td>
        <div class="ftsc" style="width: 40px;">{awayTS}</div>
    </td>
</tr>
